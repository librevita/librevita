name: "LibreVita CodeQL Configuration"

# Use the extended security query suite for deep SAST analysis.
queries:
  - uses: security-extended

# Filter out generated test mocks, built frontend static assets, and migration schemas from scanning.
paths-ignore:
  - 'internal/test/mock/**'
  - 'test/mock/**'
  - 'internal/database/record/**'
  - 'internal/database/migrations/**'
  - 'internal/ui/static/**'
  - '**/*_templ.go'
  - 'pkg/ident/codec_gen.go'
