version: 2
updates:
  # 1. GitHub Actions (maintains and updates pinned commit hashes in workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "America/Sao_Paulo"
    cooldown:
      default-days: 7
    rebase-strategy: "auto"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    assignees:
      - "gustavo-veiga"
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  # 2. Frontend npm dependencies (package.json / package-lock.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "America/Sao_Paulo"
    cooldown:
      default-days: 7
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    labels:
      - "dependencies"
      - "frontend"
    assignees:
      - "gustavo-veiga"
    ignore:
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "htmx.org"
        update-types: ["version-update:semver-major"]
      - dependency-name: "htmx-types"
        update-types: ["version-update:semver-major"]
    groups:
      npm-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5
