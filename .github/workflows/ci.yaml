name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      FORCE_COLOR: 1
      # Runners are ephemeral, so without a shared cache every run
      # re-downloads modules and rebuilds from scratch. The layer cache
      # lives in GHCR: master also pushes it (and the image); PRs only
      # read it. PRs from forks get a read-only token and no access to
      # the private packages, so they run without the remote cache.
      PUSH_FLAG: ${{ github.ref == 'refs/heads/master' && '--push' || '' }}
      CACHE_ARGS: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '' || format('--remote-cache=ghcr.io/{0}/librevita-cache', github.repository) }}
      IMAGE_TAG: ghcr.io/${{ github.repository }}:latest
    steps:
      - uses: actions/checkout@v7
      - name: Login to GHCR
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Install Earthly
        # Pin the same version as the Earthfile's VERSION, with the
        # release sha256 verified (trust-on-first-use, like the toolchain
        # digests in the Earthfile). The runner has Docker, so the CLI
        # starts its own BuildKit daemon as a container; earthly bootstrap
        # finishes the CLI configuration.
        env:
          EARTHLY_SHA256: 3ef3163c81bdd10e28ab31cd96e35c1856d97478c8ce7f20954b8bea7a598404
        run: |
          cd /tmp
          wget -q https://github.com/earthly/earthly/releases/download/v0.8.16/earthly-linux-amd64
          echo "$EARTHLY_SHA256  earthly-linux-amd64" | sha256sum -c -
          sudo install -m 0755 earthly-linux-amd64 /usr/local/bin/earthly
          earthly bootstrap
      # --ci = --no-output --use-inline-cache --save-inline-cache --strict.
      # +all runs the whole gate (Go tests, frontend tests, vet, lint,
      # binary, image); the Earthfile schedules the independent targets
      # in parallel on the same daemon, so the layers are built once and
      # the log is organized per target. The IMAGE_TAG override reaches
      # +image so --push can publish to GHCR on master.
      - name: Earthly +all
        run: earthly --ci $PUSH_FLAG $CACHE_ARGS +all --IMAGE_TAG=$IMAGE_TAG
