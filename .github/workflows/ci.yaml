name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
env:
  FORCE_COLOR: 1
jobs:
  go:
    name: Go (gen, test, vet, lint, audit, build)
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          # Same version as the Taskfile's GO_VERSION var.
          go-version: 1.26.6
          cache: true
      # The Go tasks depend on the frontend build (embedded assets), so
      # npm must run on the pinned Node like the node job — the runner's
      # system Node is not a supported version.
      - uses: actions/setup-node@v4
        with:
          # Same version as .nvmrc.
          node-version: 24.19.0
      # Task runs the same tasks as local development; the version is
      # installed through the Go toolchain so setup-go's cache covers it.
      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.52.0
      # The pinned tools (templ, sqlc, golangci-lint, govulncheck) live
      # in .tools/bin; the key changes whenever the Taskfile's version
      # pins change. PRs from forks read the base branch's cache only.
      - name: Cache pinned Go tools
        uses: actions/cache@v4
        with:
          path: .tools/bin
          key: go-tools-${{ hashFiles('taskfile.yaml') }}
      - name: Regenerate sources
        run: task gen
      # Go-only gate: the npm consumers (node-test, node-audit) run on
      # the node job with the pinned Node 24 (LTS); the frontend build that
      # the Go tasks depend on works with any modern Node on the runner.
      - name: Gate
        run: task go-test go-vet go-lint go-vuln-source go-vuln-binary build
      - uses: actions/upload-artifact@v4
        with:
          name: binary
          path: bin/librevita
          if-no-files-found: error
  node:
    name: Node (check, assets, test, audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          # Same version as .nvmrc.
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run assets
      - run: npm test
      - run: npm audit --audit-level=high
  image:
    name: OCI image
    needs: go
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: binary
          path: bin/
      # The image is built on every run to validate the Dockerfile; it
      # is pushed to GHCR only on master. Fork PRs never log in.
      - name: Build image
        run: docker build -t librevita:ci -f Dockerfile .
      - name: Login to GHCR
        if: github.ref == 'refs/heads/master'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Push image
        if: github.ref == 'refs/heads/master'
        run: |
          docker tag librevita:ci ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:latest
