name: CI
on:
  push:
    branches: [master]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  FORCE_COLOR: 1
jobs:
  go:
    name: Go (gen, test, vet, lint, audit, build)
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: SonarCloud blame and commit attribution.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Same version as the Taskfile's GO_VERSION var.
          go-version: 1.26.6
          cache: true
      # The Go tasks depend on the frontend build (embedded assets), so
      # npm must run on the pinned Node like the node job — the runner's
      # system Node is not a supported version.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Same version as .nvmrc.
          node-version: 24.19.0
      # Task runs the same tasks as local development; the version is
      # installed through the Go toolchain so setup-go's cache covers it.
      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.52.0
      # The pinned Go tools (templ, golangci-lint, govulncheck, mockery)
      # live in .tools/bin; the key changes whenever the Taskfile's version
      # pins change. PRs from forks read the base branch's cache only.
      - name: Cache pinned Go tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/bin
          key: go-tools-${{ hashFiles('taskfile.yaml') }}
      - name: Regenerate sources
        run: task gen
      - name: Verify generated sources are up to date
        run: git diff --exit-code
      # Go-only gate: the npm consumers (node-test, node-audit) run on
      # the node job with the pinned Node 24 (LTS); OSV-Scanner,
      # gitleaks, hadolint, actionlint, and zizmor run on the scanners
      # job. The frontend build that the Go tasks depend on works with
      # any modern Node on the runner.
      - name: Gate
        run: task go-test go-vet go-lint go-vuln-source go-vuln-binary build
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: false
      - name: Upload coverage to Qlty
        uses: qltysh/qlty-action/coverage@08a0a862c159eae9b9003081da6663d96efef637 # v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage.out
          strip-prefix: librevita.org
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary
          path: bin/librevita
          if-no-files-found: error
  node:
    name: Node (check, assets, test, audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Same version as .nvmrc.
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run assets
      - name: Verify production assets match repository
        run: git diff --exit-code internal/ui/static internal/ui/assets.go
      - run: npm test
      - run: npm audit --audit-level=low
  scanners:
    name: Scanners (OSV, gitleaks, hadolint, actionlint, zizmor)
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: gitleaks git scans every commit in the clone.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Setup Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
      - name: Cache pinned tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/bin
          key: scanners-${{ hashFiles('taskfile.yaml') }}
      # osv-scan runs Go call analysis, so generated sources and the
      # frontend embed must exist. The other scanners do not need them.
      - name: Gate
        run: task osv-scan gitleaks hadolint actionlint zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  image:
    name: OCI image
    needs: go
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # Push the validated image to GHCR on master.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary
          path: bin/
      # The image is built on every run to validate the Dockerfile; it
      # is pushed to GHCR only on master. Fork PRs never log in.
      - name: Build image
        run: docker build -t librevita:ci -f Dockerfile .
      - name: Login to GHCR
        if: github.ref == 'refs/heads/master'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Push image
        if: github.ref == 'refs/heads/master'
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          docker tag librevita:ci "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:latest"
