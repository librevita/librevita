name: Dependabot Assets Build

on:
  pull_request:
    branches: [master]
    paths:
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  assets:
    name: Build & Commit Assets
    runs-on: ubuntu-24.04
    if: github.event.pull_request.user.id == '49699333' && startsWith(github.head_ref, 'dependabot/npm_and_yarn/')
    permissions:
      contents: write # Push regenerated production frontend assets back to the PR branch.
    steps:
      - name: Checkout Dependabot branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production assets
        run: npm run assets

      - name: Commit and push asset updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git diff --quiet internal/ui/static internal/ui/assets.go; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add internal/ui/static internal/ui/assets.go
            git commit -m "chore: regenerate production frontend assets"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_HEAD_REF}"
          fi
