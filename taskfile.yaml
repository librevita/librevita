# ==========================================================================
# LibreVita — build pipeline (Task). Local and CI run the same tasks; no
# containers and no daemon, so builds run on the host toolchains and the
# incremental behaviour comes from the Go build cache, the npm cache and
# the sources/generates gates below.
#
# Version pins live in `vars` (single source of truth); the CI workflow
# reads this same file. To bump a toolchain, edit the version here.
# ==========================================================================
version: '3'
env:
  # CGO is disabled for every Go build: the binaries are static and the
  # production image runs on scratch. (Taskfile env only applies when
  # the variable is absent from the OS environment; PATH and GOBIN are
  # therefore set inline on the commands that need them, which always
  # wins.)
  CGO_ENABLED: '0'
  # Every go command runs on the pinned GO_VERSION toolchain - the
  # container-free equivalent of the pinned toolchain images. When the
  # local Go is older, `go` downloads exactly this version; CI installs
  # it via setup-go, so nothing is downloaded there. Without the pin,
  # binaries built by an older Go would embed its (possibly vulnerable)
  # standard library and the binary scan would fail.
  GOTOOLCHAIN: 'go{{.GO_VERSION}}'
vars:
  NAME: librevita
  GO_VERSION: 1.26.6
  NODE_VERSION: 24.19.0
  TEMPL_VERSION: v0.3.1020
  GOLANGCI_VERSION: v2.12.2
  GOVULN_VERSION: v1.1.4
  MOCKERY_VERSION: v2.53.6
  OSV_VERSION: v2.5.1
  GITLEAKS_VERSION: v8.29.1
  ACTIONLINT_VERSION: v1.7.9
  HADOLINT_VERSION: v2.14.0
  ZIZMOR_VERSION: 1.29.0
  # SHA-256 of GitHub release binaries/archives (not the inner payload of
  # a tarball). Bump together with HADOLINT_VERSION / ZIZMOR_VERSION.
  HADOLINT_SHA256_LINUX_AMD64: 6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47
  HADOLINT_SHA256_LINUX_ARM64: 331f1d3511b84a4f1e3d18d52fec284723e4019552f4f47b19322a53ce9a40ed
  HADOLINT_SHA256_DARWIN_AMD64: 2b69a853433f1eca522ffb921cd490bd1321424d03331fd8390f93b7fb4a02e9
  HADOLINT_SHA256_DARWIN_ARM64: 3625e2e9f43dcfe7bd38738a5f5520ed50ce39ed28485266e6803dd7bc197b10
  ZIZMOR_SHA256_LINUX_AMD64: dd96df044a6e8538d5f423790f453bdd03d49e5b2bcc38214acc41a2f1297839
  ZIZMOR_SHA256_LINUX_ARM64: 415eaa7c0a06479a701b8e44a3e812c1047decc848ec4bede7bd6bbf49f22d20
  ZIZMOR_SHA256_DARWIN_AMD64: 648b72ab9941a7f2a8d65d7b68a8e76cef789538c8df3a3950384d38423375b0
  ZIZMOR_SHA256_DARWIN_ARM64: 720322fade9e83a9c7953944c438f2ba942636b86b96a8f0e6b15ce94c8a6b6f
  # Progressive quality floors (same idea as cyclop max-complexity: 19).
  # Lower these as findings are cleared: error → warning → info → style
  # (hadolint) / high → medium → low → informational (zizmor).
  HADOLINT_FAILURE_THRESHOLD: style
  ZIZMOR_MIN_SEVERITY: low
  # regular hides low-severity pedantic audits (template-injection on
  # github.repository, undocumented-permissions, concurrency-limits).
  ZIZMOR_PERSONA: pedantic
tasks:
  # ------------------------------------------------------------------------
  # Tools and generated sources
  # ------------------------------------------------------------------------

  # Build-time tools (generators and analyzers), pinned by version and
  # installed from the bare toolchain: `go install pkg@version` resolves
  # the tool's own module graph, so neither the application go.mod nor
  # the other tools ever interfere. They are compiled with the pinned
  # GO_VERSION toolchain: a tool built by an older Go (e.g. govulncheck
  # on a machine whose Go predates the go.mod floor) cannot load the
  # application packages and the gate fails.
  tools:
    desc: Install the pinned Go tools into .tools/bin
    cmds:
      - 'GOBIN={{.ROOT_DIR}}/.tools/bin go install github.com/a-h/templ/cmd/templ@{{.TEMPL_VERSION}}'
      - 'GOBIN={{.ROOT_DIR}}/.tools/bin go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_VERSION}}'
      - 'GOBIN={{.ROOT_DIR}}/.tools/bin go install golang.org/x/vuln/cmd/govulncheck@{{.GOVULN_VERSION}}'
      - 'GOBIN={{.ROOT_DIR}}/.tools/bin go install github.com/vektra/mockery/v2@{{.MOCKERY_VERSION}}'
    sources:
      - taskfile.yaml
    generates:
      - .tools/bin/templ
      - .tools/bin/golangci-lint
      - .tools/bin/govulncheck
      - .tools/bin/mockery
  # OSV-Scanner is a Go tool like the ones above, but it is a large compile
  # and is only needed by `osv-scan`, so it stays off the `tools` path that
  # `go-lint` already depends on.
  tools-osv:
    desc: Install the pinned OSV-Scanner into .tools/bin
    cmds:
      - 'GOBIN={{.ROOT_DIR}}/.tools/bin go install github.com/google/osv-scanner/v2/cmd/osv-scanner@{{.OSV_VERSION}}'
    sources:
      - taskfile.yaml
    generates:
      - .tools/bin/osv-scanner
  # gitleaks and actionlint are Go tools like OSV-Scanner; they stay off
  # the `tools` path so `go-lint` does not wait on them.
  tools-gitleaks:
    desc: Install the pinned gitleaks CLI into .tools/bin
    cmds:
      - 'GOBIN={{.ROOT_DIR}}/.tools/bin go install github.com/zricethezav/gitleaks/v8@{{.GITLEAKS_VERSION}}'
    sources:
      - taskfile.yaml
    generates:
      - .tools/bin/gitleaks
  tools-actionlint:
    desc: Install the pinned actionlint CLI into .tools/bin
    cmds:
      - 'GOBIN={{.ROOT_DIR}}/.tools/bin go install github.com/rhysd/actionlint/cmd/actionlint@{{.ACTIONLINT_VERSION}}'
    sources:
      - taskfile.yaml
    generates:
      - .tools/bin/actionlint
  # hadolint is Haskell and zizmor is Rust: there is no `go install`.
  # Release binaries/archives are fetched over HTTPS and checked against
  # the SHA-256 pins above (linux/darwin, amd64/arm64). curl is required.
  tools-hadolint:
    desc: Install the pinned hadolint CLI into .tools/bin
    cmds:
      - mkdir -p {{.ROOT_DIR}}/.tools/bin
      - |
        set -euo pipefail
        case "{{OS}}-{{ARCH}}" in
          linux-amd64)  target=linux-x86_64; sha={{.HADOLINT_SHA256_LINUX_AMD64}} ;;
          linux-arm64)  target=linux-arm64; sha={{.HADOLINT_SHA256_LINUX_ARM64}} ;;
          darwin-amd64) target=macos-x86_64; sha={{.HADOLINT_SHA256_DARWIN_AMD64}} ;;
          darwin-arm64) target=macos-arm64; sha={{.HADOLINT_SHA256_DARWIN_ARM64}} ;;
          *) echo "unsupported {{OS}}/{{ARCH}} for hadolint" >&2; exit 1 ;;
        esac
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        bin="$tmp/hadolint"
        curl -fsSL -o "$bin" "https://github.com/hadolint/hadolint/releases/download/{{.HADOLINT_VERSION}}/hadolint-${target}"
        if command -v sha256sum >/dev/null 2>&1; then
          echo "$sha  $bin" | sha256sum -c -
        else
          actual=$(shasum -a 256 "$bin" | awk '{print $1}')
          [ "$actual" = "$sha" ]
        fi
        install -m 755 "$bin" "{{.ROOT_DIR}}/.tools/bin/hadolint"
    sources:
      - taskfile.yaml
    generates:
      - .tools/bin/hadolint
  tools-zizmor:
    desc: Install the pinned zizmor CLI into .tools/bin
    cmds:
      - mkdir -p {{.ROOT_DIR}}/.tools/bin
      - |
        set -euo pipefail
        case "{{OS}}-{{ARCH}}" in
          linux-amd64)  target=x86_64-unknown-linux-gnu; sha={{.ZIZMOR_SHA256_LINUX_AMD64}} ;;
          linux-arm64)  target=aarch64-unknown-linux-gnu; sha={{.ZIZMOR_SHA256_LINUX_ARM64}} ;;
          darwin-amd64) target=x86_64-apple-darwin; sha={{.ZIZMOR_SHA256_DARWIN_AMD64}} ;;
          darwin-arm64) target=aarch64-apple-darwin; sha={{.ZIZMOR_SHA256_DARWIN_ARM64}} ;;
          *) echo "unsupported {{OS}}/{{ARCH}} for zizmor" >&2; exit 1 ;;
        esac
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        archive="$tmp/zizmor.tar.gz"
        curl -fsSL -o "$archive" "https://github.com/zizmorcore/zizmor/releases/download/v{{.ZIZMOR_VERSION}}/zizmor-${target}.tar.gz"
        if command -v sha256sum >/dev/null 2>&1; then
          echo "$sha  $archive" | sha256sum -c -
        else
          actual=$(shasum -a 256 "$archive" | awk '{print $1}')
          [ "$actual" = "$sha" ]
        fi
        tar -xzf "$archive" -C "$tmp"
        install -m 755 "$tmp/zizmor" "{{.ROOT_DIR}}/.tools/bin/zizmor"
    sources:
      - taskfile.yaml
    generates:
      - .tools/bin/zizmor
  # SQL/text codecs for pkg/ident defined types. types.go is the source
  # of truth; gen.go writes codec_gen.go.
  gen-ident:
    desc: Generate ident UUID codecs from types.go
    cmds:
      - go generate ./pkg/ident
    sources:
      - pkg/ident/types.go
      - pkg/ident/gen.go
    generates:
      - pkg/ident/codec_gen.go
  # Generated Ent entities and versioned migration helpers. The bootstrap
  # file seeds the target package so `ent generate` can resolve the record
  # package path on a clean checkout.
  gen-ent:
    desc: Regenerate Ent client, entities, and migration helpers
    deps:
      - gen-ident
    cmds:
      - mkdir -p internal/database/record
      - 'printf "package record\n" > internal/database/record/doc.go'
      - go generate ./internal/database/schema
    sources:
      - internal/database/schema/**/*.go
      - internal/database/codegen/**/*.go
      - internal/core/database/fle/*.go
    generates:
      - internal/database/record/doc.go
      - internal/database/record/client.go
      - internal/database/record/record.go
      - internal/database/record/mutation.go
      - internal/database/record/patient.go
      - internal/database/record/runtime.go
      - internal/database/record/tx.go
      - internal/database/record/migrate/migrate.go
      - internal/database/record/migrate/schema.go
  # Generate a new versioned Goose migration using Atlas from Ent schema diffs for SQLite and PostgreSQL.
  db-diff:
    desc: 'Generate versioned Goose migrations from Ent schema for SQLite and PostgreSQL (usage: task db-diff -- name=add_patient_model)'
    deps:
      - gen-ent
    cmds:
      - go run ./cmd/migrate --dialect=sqlite --dir=internal/database/migrations/sqlite --name={{.name}}
      - cmd: go run ./cmd/migrate --dialect=postgres --dir=internal/database/migrations/postgres --name={{.name}}
        ignore_error: true
    vars:
      name: '{{.name | default "changes"}}'

  db-diff-sqlite:
    desc: 'Generate versioned Goose migration for SQLite (usage: task db-diff-sqlite -- name=add_patient_model)'
    deps:
      - gen-ent
    cmds:
      - go run ./cmd/migrate --dialect=sqlite --dir=internal/database/migrations/sqlite --name={{.name}}
    vars:
      name: '{{.name | default "changes"}}'

  db-diff-postgres:
    desc: 'Generate versioned Goose migration for PostgreSQL (usage: task db-diff-postgres -- name=add_patient_model)'
    deps:
      - gen-ent
    cmds:
      - go run ./cmd/migrate --dialect=postgres --dir=internal/database/migrations/postgres --name={{.name}}
    vars:
      name: '{{.name | default "changes"}}'
  # Consolidated schema for sqlc, derived from the Goose migrations (the
  # single source of truth). Only the packages on the schemagen import
  # chain are watched, so changes elsewhere do not regenerate the schema.
  # Generated templ views, exported to the workspace for editor support.
  gen-templ:
    desc: Generate the templ views
    deps:
      - tools
    cmds:
      - 'PATH={{.ROOT_DIR}}/.tools/bin:$PATH templ generate'
    sources:
      - '**/*.templ'
    generates:
      - '**/*_templ.go'
  gen-mocks:
    desc: Regenerate Mockery interface mocks
    deps:
      - tools
      - gen-ent
    cmds:
      - rm -rf internal/test/mock
      - 'PATH={{.ROOT_DIR}}/.tools/bin:$PATH mockery'
    sources:
      - .mockery.yaml
      - 'internal/**/*.go'
    generates:
      - 'internal/test/mock/**/*.go'
  gen:
    desc: Regenerate Ent models, schema, mocks, templ views, and ident codecs
    deps:
      - gen-ident
      - gen-ent
      - gen-mocks
      - gen-templ
  # ------------------------------------------------------------------------
  # Frontend (Node)
  # ------------------------------------------------------------------------

  # npm dependencies. Rebuilt only when package.json or package-lock.json
  # change.
  node-deps:
    desc: Install the pinned npm dependencies
    cmds:
      - npm ci
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/.package-lock.json
  # Type-check the TypeScript sources (noEmit, validation only). Always
  # runs: tsc has no output to gate on and is fast.
  node-check:
    desc: Type-check the TypeScript sources
    deps:
      - node-deps
    cmds:
      - npm run check
  # Compiled assets: the CSS pipeline (Tailwind JIT + autoprefixer +
  # cssnano) and the single JS bundle (HTMX runtime + SSE extension +
  # theme bootstrap + ui manifest, esbuild for the XP browser floor),
  # all written with content-addressed names (app-<hash>.css,
  # app-<hash>.js) plus internal/ui/assets.go with their paths. Tailwind
  # scans the templates and the TS sources for class names, so they are
  # inputs here as well.
  node-assets:
    desc: Compile the CSS and JS assets into internal/ui/static
    deps:
      - node-check
    cmds:
      - npm run assets
    sources:
      - tailwind.config.ts
      - internal/ui/input.css
      - 'internal/**/*.templ'
      - 'internal/ui/ts/**/*.{ts,tsx}'
      - tsconfig.json
      - internal/ui/build.ts
    generates:
      - internal/ui/assets.go
      - 'internal/ui/static/css/app-*.css'
      - 'internal/ui/static/js/app-*.js'
  # Compiled assets (CSS, bundled JS) plus the type-check dependency,
  # exported into internal/ui/static for the embed layer and the editor.
  frontend:
    desc: Compile the CSS and JS assets into internal/ui/static
    deps:
      - node-assets

  # Debug build: unminified bundle with an inline source map, so the
  # old engines' devtools can map errors back to the TS sources. Use
  # with `task dev` afterwards and rebuild the binary.
  frontend-dev:
    desc: Compile the frontend in dev mode (unminified + source map)
    deps:
      - node-deps
    cmds:
      - npm run assets -- --dev
  # ------------------------------------------------------------------------
  # Go consumers
  # ------------------------------------------------------------------------
  go-test:
    desc: Run the Go test suite
    deps:
      - gen
      - frontend
    cmds:
      - go test -coverprofile=coverage.out -covermode=atomic ./...
  go-vet:
    desc: Run go vet
    deps:
      - gen
      - frontend
    cmds:
      - go vet ./...
  go-lint:
    desc: 'Run golangci-lint (config: .golangci.yaml)'
    deps:
      - tools
      - gen
      - frontend
    cmds:
      - 'PATH={{.ROOT_DIR}}/.tools/bin:$PATH golangci-lint run'
  # Scan the module for known vulnerabilities (Go Vulnerability Database,
  # source analysis: reports only symbols the code actually calls).
  go-vuln-source:
    desc: Scan the module for known vulnerabilities (source analysis)
    deps:
      - tools
    cmds:
      - 'PATH={{.ROOT_DIR}}/.tools/bin:$PATH govulncheck ./...'
  # Scan the application binary for known vulnerabilities. The build is
  # unsymbolized: with -s -w the call graph is unavailable and
  # govulncheck reports every vulnerability in the module graph -
  # including GO-2026-5932, the deprecated-by-design x/crypto/openpgp
  # that the code never calls, which would keep the gate red forever.
  # With symbols, the symbol-level filter applies and only reachable
  # code is reported.
  go-vuln-binary:
    desc: Scan the application binary for known vulnerabilities
    deps:
      - tools
    cmds:
      - go build -o bin/{{.NAME}}-scan ./cmd/web
      - 'PATH={{.ROOT_DIR}}/.tools/bin:$PATH govulncheck -mode=binary bin/{{.NAME}}-scan'
    sources:
      - 'cmd/**/*.go'
      - 'internal/**/*.go'
      - 'pkg/**/*.go'
      - go.mod
      - go.sum
    generates:
      - bin/{{.NAME}}-scan
  node-test:
    desc: Run the frontend unit tests
    deps:
      - node-deps
    cmds:
      - npm test
  node-audit:
    desc: npm audit (known vulnerabilities in the frontend dependencies)
    deps:
      - node-deps
    cmds:
      - npm audit --audit-level=low
  # Lockfile scan against OSV.dev (Go + npm). npm has no call graph, so
  # every advisory in package-lock.json is reported. --all-vulns is the
  # progressive cap (uncalled and unimportant advisories fail too); scan
  # still has no CVSS fail floor, so remaining exceptions stay in
  # osv-scanner.toml.
  osv-scan:
    desc: Scan go.mod and package-lock.json against the OSV database
    deps:
      - tools-osv
    cmds:
      - 'PATH={{.ROOT_DIR}}/.tools/bin:$PATH osv-scanner scan source --all-vulns --lockfile=go.mod --lockfile=package-lock.json'
  # Dockerfile linter. --failure-threshold matches cyclop: findings
  # below the cap are still printed but do not fail the gate.
  hadolint:
    desc: Lint the Dockerfile with hadolint
    deps:
      - tools-hadolint
    cmds:
      - 'PATH={{.ROOT_DIR}}/.tools/bin:$PATH hadolint --failure-threshold {{.HADOLINT_FAILURE_THRESHOLD}} Dockerfile'
  # Secret scan of the git history available in the clone (full locally;
  # the scanners CI job fetches all commits). Config: .gitleaks.toml.
  # Git mode skips .gitignore paths such as a local .env.
  gitleaks:
    desc: 'Scan git history for secrets (config: .gitleaks.toml)'
    deps:
      - tools-gitleaks
    cmds:
      - 'PATH={{.ROOT_DIR}}/.tools/bin:$PATH gitleaks git {{.ROOT_DIR}} --config={{.ROOT_DIR}}/.gitleaks.toml --no-banner'
  # GitHub Actions workflow linter (syntax and expressions). Complements
  # zizmor, which flags security findings and workflow code smells.
  actionlint:
    desc: Lint GitHub Actions workflows with actionlint
    deps:
      - tools-actionlint
    cmds:
      - 'PATH={{.ROOT_DIR}}/.tools/bin:$PATH actionlint'
  # Workflow security and code smells (persona pedantic). Online audits
  # (impostor commits, unpinned actions that need the API) run when
  # GH_TOKEN or GITHUB_TOKEN is set; otherwise only offline audits run.
  # --min-severity matches cyclop: findings below the cap are omitted.
  zizmor:
    desc: Lint GitHub Actions workflows with zizmor (security and code smells)
    deps:
      - tools-zizmor
    cmds:
      - 'PATH={{.ROOT_DIR}}/.tools/bin:$PATH zizmor --persona={{.ZIZMOR_PERSONA}} --min-severity={{.ZIZMOR_MIN_SEVERITY}} .'
  # ------------------------------------------------------------------------
  # Public targets
  # ------------------------------------------------------------------------

  # Run the complete test suite: Go tests and the frontend unit tests.
  test:
    desc: Run the complete test suite
    deps:
      - go-test
      - node-test
  vet:
    desc: Run static analysis
    deps:
      - go-vet
  lint:
    desc: Run golangci-lint, hadolint, actionlint, and zizmor
    deps:
      - go-lint
      - hadolint
      - actionlint
      - zizmor
  # Security audits: the Go module scan (govulncheck), the binary scan,
  # npm audit, OSV-Scanner, and gitleaks.
  audit:
    desc: Security audits (Go source, Go binary, npm, OSV, gitleaks)
    deps:
      - go-vuln-source
      - go-vuln-binary
      - node-audit
      - osv-scan
      - gitleaks
  # Build the application binary: stripped production build writing
  # bin/NAME.
  build:
    desc: Build the optimized production binary (bin/{{.NAME}})
    deps:
      - gen
      - frontend
    cmds:
      - go build -trimpath -ldflags="-s -w -buildid=" -o bin/{{.NAME}} ./cmd/web
    sources:
      - 'cmd/**/*.go'
      - 'internal/**/*.go'
      - 'internal/**/*.templ'
      - 'internal/ui/static/**'
      - 'pkg/**/*.go'
      - 'db/**'
      - go.mod
      - go.sum
      - sqlc.yaml
    generates:
      - bin/{{.NAME}}
  # Build and compress the production binary with UPX (bin/NAME).
  build-compressed:
    desc: Build the production binary and compress with UPX (bin/{{.NAME}})
    deps:
      - build
    cmds:
      - upx --best --lzma bin/{{.NAME}}
    generates:
      - bin/{{.NAME}}
  # Fast, unoptimized binary for the development loop: bin/NAME-dev.
  # Uses the unminified dev assets (source map) instead of the
  # production frontend, which would clobber them.
  dev:
    desc: Build the fast unoptimized binary (bin/{{.NAME}}-dev)
    deps:
      - gen
      - frontend-dev
    cmds:
      - go build -o bin/{{.NAME}}-dev ./cmd/web
    sources:
      - 'cmd/**/*.go'
      - 'internal/**/*.go'
      - 'internal/**/*.templ'
      - 'internal/ui/static/**'
      - 'pkg/**/*.go'
      - 'db/**'
      - go.mod
      - go.sum
      - sqlc.yaml
    generates:
      - bin/{{.NAME}}-dev
  # Cross-compile the production binary, e.g. `task cross -- os=linux
  # arch=riscv64`.
  cross:
    desc: Cross-compile the production binary
    deps:
      - gen
      - frontend
    cmds:
      - 'GOOS={{.os}} GOARCH={{.arch}} go build -trimpath -ldflags="-s -w -buildid=" -o bin/{{.NAME}}-{{.os}}-{{.arch}} ./cmd/web'
    vars:
      os: linux
      arch: amd64
  # Synchronize module metadata. Runs against generated sources so
  # imports of templ and sqlc output resolve.
  tidy:
    desc: Sync go.mod/go.sum
    deps:
      - gen
      - frontend
    cmds:
      - go mod tidy
    generates:
      - go.mod
      - go.sum
  # Minimal non-root production image; needs podman or docker
  # (`task image -- IMG=docker`).
  image:
    desc: Build the OCI image
    deps:
      - build
    cmds:
      - '{{.IMG}} build -t {{.IMAGE_TAG}} -f Dockerfile .'
    vars:
      IMAGE_TAG: librevita:latest
      IMG: podman
  # Running bare `task` (no arguments) runs the full validation gate,
  # the same as `task all`.
  default:
    desc: 'Default task: the full validation gate'
    deps:
      - all

  # Validate code, analysis, and the production image together; the CI
  # runs the same gate (split across jobs).
  all:
    desc: 'Full validation gate: tests, vet, lint, audits, binary and image'
    deps:
      - test
      - vet
      - lint
      - audit
      - build
      - image
