# Generate typed Go repositories from SQL.
# SQLite uses modernc.org/sqlite; CGO is disabled.
# Each domain has an isolated query package.
# UUID columns are typed as uuid.UUID and 0/1 flags as bool (see the
# overrides under each gen block).
version: "2"
sql:
  - name: "patient"
    engine: "sqlite"
    schema: "db/schema/"
    queries: "db/query/patient.sql"
    gen:
      go:
        package: "repository"
        out: "internal/domain/patient/repository"
        sql_package: "database/sql"
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - go_type:
              import: "github.com/google/uuid"
              package: "uuid"
              type: "UUID"
            column: "patients.id"
          - go_type:
              import: "github.com/google/uuid"
              package: "uuid"
              type: "UUID"
            column: "patients.clinic_id"
          - go_type:
              import: "github.com/google/uuid"
              package: "uuid"
              type: "UUID"
            column: "patients.created_by"
  - name: "appointment"
    engine: "sqlite"
    schema: "db/schema/"
    queries: "db/query/appointment.sql"
    gen:
      go:
        package: "repository"
        out: "internal/domain/appointment/repository"
        sql_package: "database/sql"
        emit_empty_slices: true
  - name: "episode"
    engine: "sqlite"
    schema: "db/schema/"
    queries: "db/query/episode.sql"
    gen:
      go:
        package: "repository"
        out: "internal/domain/episode/repository"
        sql_package: "database/sql"
        emit_empty_slices: true
  - name: "calendar"
    engine: "sqlite"
    schema: "db/schema/"
    queries: "db/query/calendar.sql"
    gen:
      go:
        package: "repository"
        out: "internal/domain/calendar/repository"
        sql_package: "database/sql"
        emit_empty_slices: true
  - name: "user"
    engine: "sqlite"
    schema: "db/schema/"
    queries:
      - "db/query/user.sql"
      - "db/query/roles.sql"
      - "db/query/specialties.sql"
      - "db/query/staff.sql"
      - "db/query/meta.sql"
    gen:
      go:
        package: "repository"
        out: "internal/domain/user/repository"
        sql_package: "database/sql"
        emit_empty_slices: true
        overrides:
          - go_type:
              import: "github.com/google/uuid"
              package: "uuid"
              type: "UUID"
            column: "users.id"
          - go_type:
              import: "github.com/google/uuid"
              package: "uuid"
              type: "UUID"
            column: "users.role_id"
          - go_type:
              import: "github.com/google/uuid"
              package: "uuid"
              type: "UUID"
            column: "roles.id"
          - go_type:
              import: "github.com/google/uuid"
              package: "uuid"
              type: "UUID"
            column: "specialties.id"
          - go_type:
              import: "github.com/google/uuid"
              package: "uuid"
              type: "UUID"
            column: "specialties.clinic_id"
          - go_type:
              import: "github.com/google/uuid"
              package: "uuid"
              type: "UUID"
            column: "user_specialties.user_id"
          - go_type:
              import: "github.com/google/uuid"
              package: "uuid"
              type: "UUID"
            column: "user_specialties.specialty_id"
          - go_type:
              import: "github.com/google/uuid"
              package: "uuid"
              type: "UUID"
            column: "staff_change_requests.id"
          - go_type:
              import: "github.com/google/uuid"
              package: "uuid"
              type: "UUID"
            column: "staff_change_requests.user_id"
          - go_type:
              import: "github.com/google/uuid"
              package: "uuid"
              type: "UUID"
            column: "staff_change_requests.requested_by"
          - go_type:
              import: "github.com/google/uuid"
              package: "uuid"
              type: "UUID"
            column: "staff_change_requests.decided_by"
          - go_type: "bool"
            column: "users.active"
          - go_type: "bool"
            column: "roles.system"
          - go_type: "bool"
            column: "roles.is_clinical"
  - name: "audit"
    engine: "sqlite"
    schema: "db/schema/"
    queries: "db/query/audit.sql"
    gen:
      go:
        package: "repository"
        out: "internal/core/audit/repository"
        sql_package: "database/sql"
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - go_type:
              import: "github.com/google/uuid"
              package: "uuid"
              type: "UUID"
            column: "audit_log.actor_id"
  - name: "clinic"
    engine: "sqlite"
    schema: "db/schema/"
