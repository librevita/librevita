# ==============================================================================
# SonarCloud configuration for LibreVita
# Project: https://sonarcloud.io/project/overview?id=librevita_librevita
# ==============================================================================

sonar.projectKey=librevita_librevita
sonar.organization=librevita

# Source and Test directories
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,internal/ui/ts/ui_test.ts

# Files to exclude from code quality analysis (generated code, mocks, builds)
sonar.exclusions=\
  **/*_test.go,\
  ent/**,\
  .entc/**,\
  tests/mocks/**,\
  **/*_templ.go,\
  internal/database/migrations/**,\
  internal/ui/static/**,\
  internal/ui/assets.go,\
  node_modules/**,\
  bin/**,\
  .tools/**,\
  .task/**,\
  data/**

# Coverage reporting
sonar.go.coverage.reportPaths=coverage.out
