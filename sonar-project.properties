# ==============================================================================
# SonarCloud configuration for LibreVita
# Project: https://sonarcloud.io/project/overview?id=librevita_librevita
# ==============================================================================

sonar.host.url=https://sonarcloud.io
sonar.projectKey=librevita_librevita
sonar.organization=librevita

# ==============================================================================
# Source and Test Inclusions
# ==============================================================================
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/*_test.ts

# ==============================================================================
# Analysis Exclusions (Generated code, mocks, build artifacts, tooling)
# ==============================================================================
sonar.exclusions=\
  .entc/**,\
  .githooks/**,\
  .task/**,\
  .tools/**,\
  bin/**,\
  data/**,\
  node_modules/**,\
  internal/database/migrations/**,\
  internal/database/record/**,\
  internal/test/**,\
  internal/ui/assets.go,\
  internal/ui/static/**,\
  pkg/ident/codec_gen.go,\
  test/**,\
  **/*_templ.go,\
  **/*_test.go,\
  **/*_test.ts

# ==============================================================================
# Coverage Exclusions (Entrypoints and config files - aligns with Codecov)
# ==============================================================================
sonar.coverage.exclusions=\
  cmd/**,\
  **/*.config.ts

# ==============================================================================
# Coverage Reports
# ==============================================================================
sonar.go.coverage.reportPaths=coverage.out
