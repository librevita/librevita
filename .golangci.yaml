# golangci-lint configuration. The standard default set (errcheck,
# govet, ineffassign, staticcheck, unused) matches the project's
# baseline; misspell and gofmt add style checks. Generated files are
# excluded: they are build artifacts produced by templ and sqlc.
version: "2"
run:
  timeout: 5m
  tests: true
formatters:
  enable:
    - gofmt
linters:
  default: standard
  enable:
    - misspell
    - gosec
    - bodyclose
    - loggercheck
    - forbidigo
    - cyclop
    - gocognit
    - maintidx
  settings:
    cyclop:
      # Reports functions whose cyclomatic complexity is greater than
      # this value. Cap is 20 (19 is allowed; 20+ fails).
      # package-average stays at the default 0 (disabled).
      max-complexity: 19
    gocognit:
      # Reports functions whose cognitive complexity is at least this
      # value. Complementary to cyclop (nesting and compound booleans).
      # Cap is 20 (20+ fails).
      min-complexity: 20
    maintidx:
      # Reports functions whose maintainability index is under this
      # value. 20 is standard (under 20 fails).
      under: 20
    gosec:
      # G104 duplicates errcheck (which already allows the idiomatic
      # close/rollback defers via exclude-functions).
      excludes:
        - G104
    errcheck:
      # Defers of Close/Rollback/Remove are cleanup paths whose error is
      # not actionable at that point; the standard library idiom.
      exclude-functions:
        - (io.Closer).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - (*multipart.Writer).Close
        - (*os.File).Close
        - os.Remove
    loggercheck:
      # Catch leftover slog and zap.SugaredLogger kv. Do not list pkg/log:
      # custom rules are kv-style and would false-positive on ...Field.
      zap: true
      slog: true
      kitlog: false
      klog: false
      logr: false
      require-string-key: true
      no-printf-like: true
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: slog\.(Debug|Info|Warn|Error|Log|New)
          msg: use librevita.org/pkg/log instead of log/slog
        - pattern: zap\.(New|NewProduction|NewDevelopment)
          msg: construct zap loggers in internal/core/telemetry only
  exclusions:
    rules:
      - path: internal/core/telemetry/
        linters:
          - forbidigo
      - path: pkg/log/
        linters:
          - forbidigo
      - path: _test\.go
        linters:
          - cyclop
          - gocognit
          - maintidx
issues:
  exclude-files:
    - "**/*_templ.go"
