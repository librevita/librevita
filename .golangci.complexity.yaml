# Informational complexity report (task complexity). Not a CI gate:
# issues-exit-code is 0 so the task lists functions without failing.
# Thresholds are lower than .golangci.yaml so more than the gate is shown.
version: "2"
run:
  timeout: 5m
  tests: true
  issues-exit-code: 0
linters:
  default: none
  enable:
    - cyclop
    - gocognit
  settings:
    cyclop:
      max-complexity: 10
    gocognit:
      min-complexity: 10
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - cyclop
          - gocognit
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-files:
    - "**/*_templ.go"
